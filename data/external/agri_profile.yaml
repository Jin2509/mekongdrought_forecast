# Du lieu nen cho he khuyen nghi (rule + RAG). GIA TRI THAM KHAO:
# can doi chieu Nien giam thong ke tinh va khuyen cao cua Bo NN&MT truoc khi dua vao bao cao.

# Nguong chiu man (‰ = g/l). min_safe: an toan; damage: bat dau gay hai.
salinity_tolerance:
  rice:          {name: Lúa,               min_safe: 1.0, damage: 2.0, severe: 4.0}
  durian:        {name: Sầu riêng,         min_safe: 0.3, damage: 0.5, severe: 1.0}
  fruit_general: {name: Cây ăn trái khác,  min_safe: 0.5, damage: 1.0, severe: 2.0}
  vegetables:    {name: Rau màu,           min_safe: 0.5, damage: 1.0, severe: 2.0}
  coconut:       {name: Dừa,               min_safe: 2.0, damage: 4.0, severe: 6.0}
  shrimp:        {name: Tôm nước lợ,       optimal_low: 5.0, optimal_high: 25.0}
  domestic:      {name: Nước sinh hoạt,    max_chloride_mg_l: 250}   # QCVN 01-1:2018/BYT

# Lich thoi vu lua chung cho DBSCL (thang gieo -> thang thu hoach)
rice_seasons:
  dong_xuan: {name: Đông Xuân, sow: [11, 12], harvest: [2, 3]}
  he_thu:    {name: Hè Thu,    sow: [4, 5],   harvest: [7, 8]}
  thu_dong:  {name: Thu Đông,  sow: [7, 8],   harvest: [10, 11]}

# San xuat chinh theo tinh (dia gioi cu), dung de chon khuyen nghi phu hop
provinces:
  LA: [rice, fruit_general, vegetables]
  TG: [durian, fruit_general, rice]
  BT: [coconut, fruit_general, durian, shrimp]
  TV: [rice, coconut, shrimp]
  VL: [fruit_general, rice, vegetables]
  DT: [rice, fruit_general]
  AG: [rice, vegetables]
  KG: [rice, shrimp]
  CT: [rice, fruit_general]
  HG: [rice, fruit_general]
  ST: [rice, shrimp, vegetables]
  BL: [shrimp, rice]
  CM: [shrimp, rice]
